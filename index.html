<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【女子の部】那覇地区夏季大会速報</title>
    
    <!-- 最小限のライブラリ読み込み -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="tel"] {
            font-size: 16px; /* スマホで自動ズームさせないため */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ADMIN_PASSWORD = "naha";

        // レイアウト設定（超コンパクト）
        const W = 96;  // カード幅
        const H = 48;  // カード高さ
        const GAP = 16;
        const Y_STEP = 72;

        const NODES = {
            seed1: { x: 0, y: 0, label: '神森', isSeed: true },
            A3:    { x: W + GAP, y: 0, label: 'A3' },
            B6:    { x: (W + GAP) * 2, y: 0, label: 'B6' },
            A7:    { x: (W + GAP) * 3, y: 0, label: 'A7' },
            B3:    { x: (W + GAP) * 4, y: 0, label: 'B3' },
            seed2: { x: (W + GAP) * 5, y: 0, label: '仲西', isSeed: true },
            
            A6:    { x: (0 + W + GAP) / 2, y: Y_STEP, label: 'A6' },
            B7:    { x: ((W + GAP)*4 + (W + GAP)*5) / 2, y: Y_STEP, label: 'B7' },
            
            あ1:   { x: ((0 + W + GAP)/2 + (W + GAP)*2) / 2, y: Y_STEP * 2, label: 'あ1' },
            い1:   { x: ((W + GAP)*3 + ((W + GAP)*4 + (W + GAP)*5)/2) / 2, y: Y_STEP * 2, label: 'い1' },
            
            あ3:   { x: (((0 + W + GAP)/2 + (W + GAP)*2)/2 + ((W + GAP)*3 + ((W + GAP)*4 + (W + GAP)*5)/2)/2) / 2, y: Y_STEP * 3, label: 'あ3(決勝)' }
        };

        const CONNECTIONS = [
            { from: 'seed1', to: 'A6' },
            { from: 'A3', to: 'A6' },
            { from: 'A6', to: 'あ1' },
            { from: 'B6', to: 'あ1' },
            { from: 'あ1', to: 'あ3' },
            { from: 'A7', to: 'い1' },
            { from: 'B3', to: 'B7' },
            { from: 'seed2', to: 'B7' },
            { from: 'B7', to: 'い1' },
            { from: 'い1', to: 'あ3' }
        ];

        function App() {
            // ステート
            const [matches, setMatches] = useState({
                A3: { s1: '', s2: '', winner: null },
                B6: { s1: '', s2: '', winner: null },
                A7: { s1: '', s2: '', winner: null },
                B3: { s1: '', s2: '', winner: null },
                A6: { s1: '', s2: '', winner: null },
                B7: { s1: '', s2: '', winner: null },
                あ1: { s1: '', s2: '', winner: null },
                い1: { s1: '', s2: '', winner: null },
                あ3: { s1: '', s2: '', winner: null }
            });
            const [isAdmin, setIsAdmin] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [scale, setScale] = useState(1);

            // データ読み込みと保存
            useEffect(() => {
                const saved = localStorage.getItem('naha_hb_v4');
                if (saved) setMatches(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('naha_hb_v4', JSON.stringify(matches));
            }, [matches]);

            // スマホ画面への自動フィット処理
            useEffect(() => {
                const handleResize = () => {
                    // 全体幅(約660px)が画面に収まるようにスケールを計算
                    const newScale = Math.min(1, window.innerWidth / 680);
                    setScale(newScale);
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // チーム名取得ロジック
            const getTeam = (id, isP1) => {
                const w = (matchId) => matches[matchId].winner;
                if (id === 'A3') return isP1 ? '昭薬附' : '石田';
                if (id === 'B6') return isP1 ? 'コラソン' : '浦西';
                if (id === 'A7') return isP1 ? '浦添' : 'ITS';
                if (id === 'B3') return isP1 ? '港川' : '松島';
                
                if (id === 'A6') return isP1 ? '神森' : w('A3');
                if (id === 'B7') return isP1 ? w('B3') : '仲西';
                
                if (id === 'あ1') return isP1 ? w('A6') : w('B6');
                if (id === 'い1') return isP1 ? w('A7') : w('B7');
                
                if (id === 'あ3') return isP1 ? w('あ1') : w('い1');
                return null;
            };

            const handleAuth = () => {
                if (isAdmin) {
                    setIsAdmin(false);
                } else {
                    const pass = prompt("管理者パスワードを入力してください");
                    if (pass === ADMIN_PASSWORD) setIsAdmin(true);
                    else if (pass !== null) alert("パスワードが違います");
                }
            };

            const handleCardClick = (id) => {
                if (!isAdmin) return;
                setEditingId(id);
            };

            const handleSave = (id, s1, s2) => {
                const p1 = getTeam(id, true);
                const p2 = getTeam(id, false);
                let winner = null;

                const n1 = parseInt(s1);
                const n2 = parseInt(s2);
                if (!isNaN(n1) && !isNaN(n2)) {
                    if (n1 > n2) winner = p1;
                    else if (n2 > n1) winner = p2;
                    else winner = confirm(`${p1} の勝ちにしますか？（キャンセルで ${p2} の勝ち）`) ? p1 : p2;
                }

                const newMatches = { ...matches, [id]: { s1, s2, winner } };
                
                // 勝者がリセットされたら下流もリセット
                if (!winner) {
                    const resetDownstream = (currentId) => {
                        const conn = CONNECTIONS.find(c => c.from === currentId);
                        if (conn) {
                            newMatches[conn.to] = { s1: '', s2: '', winner: null };
                            resetDownstream(conn.to);
                        }
                    };
                    resetDownstream(id);
                }
                
                setMatches(newMatches);
                setEditingId(null);
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* ヘッダー */}
                    <header className="bg-slate-800 text-white p-3 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="text-sm font-bold">那覇地区夏季大会 (女子)</h1>
                        </div>
                        <button 
                            onClick={handleAuth}
                            className={`px-3 py-1 text-xs font-bold rounded ${isAdmin ? 'bg-emerald-500 text-white' : 'bg-slate-600 text-slate-200'}`}
                        >
                            {isAdmin ? '🔓 編集モード' : '🔒 閲覧モード'}
                        </button>
                    </header>

                    {/* トーナメント表エリア */}
                    <main className="flex-1 relative overflow-hidden flex justify-center mt-4">
                        <div 
                            className="relative origin-top transition-transform"
                            style={{ width: 660, height: 350, transform: `scale(${scale})` }}
                        >
                            {/* 線の描画 */}
                            <svg className="absolute inset-0 pointer-events-none" width="100%" height="100%">
                                {CONNECTIONS.map((c, i) => {
                                    const fromNode = NODES[c.from];
                                    const toNode = NODES[c.to];
                                    const startX = fromNode.x + W / 2;
                                    const startY = fromNode.y + H;
                                    const endX = toNode.x + W / 2;
                                    const endY = toNode.y;
                                    const midY = startY + (endY - startY) / 2;

                                    const isWinnerPath = c.from.startsWith('seed') || (matches[c.from] && matches[c.from].winner);
                                    const color = isWinnerPath ? "#dc2626" : "#cbd5e1";
                                    const strokeW = isWinnerPath ? "2.5" : "1.5";

                                    return (
                                        <path 
                                            key={i} 
                                            d={`M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`} 
                                            fill="none" stroke={color} strokeWidth={strokeW} 
                                        />
                                    );
                                })}
                            </svg>

                            {/* ノードの描画 */}
                            {Object.entries(NODES).map(([id, node]) => {
                                if (node.isSeed) {
                                    return (
                                        <div key={id} className="absolute bg-white border-2 border-red-500 rounded text-center font-bold text-red-600 shadow-sm flex items-center justify-center text-xs" style={{ left: node.x, top: node.y, width: W, height: H }}>
                                            {node.label}
                                        </div>
                                    );
                                }

                                const match = matches[id];
                                const p1 = getTeam(id, true);
                                const p2 = getTeam(id, false);
                                const w = match.winner;

                                return (
                                    <div 
                                        key={id} 
                                        onClick={() => handleCardClick(id)}
                                        className={`absolute bg-white border border-slate-300 rounded flex flex-col text-[11px] shadow-sm overflow-hidden ${isAdmin ? 'cursor-pointer hover:border-blue-400' : ''}`}
                                        style={{ left: node.x, top: node.y, width: W, height: H }}
                                    >
                                        <div className="bg-slate-100 text-center text-[9px] font-bold text-slate-500 py-0.5 border-b border-slate-200">
                                            {node.label}
                                        </div>
                                        <div className={`flex-1 flex px-1.5 items-center justify-between ${w && w === p1 ? 'bg-red-50' : ''}`}>
                                            <span className={`truncate w-14 ${w && w === p1 ? 'font-bold text-red-600' : 'text-slate-700'}`}>{p1 || '-'}</span>
                                            <span className={`font-bold ${w && w === p1 ? 'text-red-600' : 'text-slate-900'}`}>{match.s1}</span>
                                        </div>
                                        <div className={`flex-1 flex px-1.5 items-center justify-between border-t border-slate-100 ${w && w === p2 ? 'bg-red-50' : ''}`}>
                                            <span className={`truncate w-14 ${w && w === p2 ? 'font-bold text-red-600' : 'text-slate-700'}`}>{p2 || '-'}</span>
                                            <span className={`font-bold ${w && w === p2 ? 'text-red-600' : 'text-slate-900'}`}>{match.s2}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* スコア入力モーダル（シンプル版） */}
                    {editingId && (() => {
                        const p1 = getTeam(editingId, true);
                        const p2 = getTeam(editingId, false);
                        if (!p1 || !p2) {
                            return (
                                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
                                    <div className="bg-white p-6 rounded-lg text-center shadow-xl">
                                        <p className="font-bold mb-4 text-slate-700">対戦カードが未確定です</p>
                                        <button onClick={() => setEditingId(null)} className="px-6 py-2 bg-slate-200 rounded font-bold">閉じる</button>
                                    </div>
                                </div>
                            );
                        }
                        
                        return (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white w-full max-w-sm rounded-lg shadow-xl overflow-hidden">
                                    <div className="bg-slate-800 text-white px-4 py-3 font-bold text-sm">
                                        {NODES[editingId].label} スコア入力
                                    </div>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        handleSave(editingId, e.target.s1.value, e.target.s2.value);
                                    }} className="p-4 space-y-4">
                                        <div className="flex items-center justify-between bg-slate-50 p-3 rounded border">
                                            <span className="font-bold text-slate-800">{p1}</span>
                                            <input name="s1" type="tel" defaultValue={matches[editingId].s1} className="w-16 text-center text-xl font-bold border rounded p-1" autoFocus/>
                                        </div>
                                        <div className="flex items-center justify-between bg-slate-50 p-3 rounded border">
                                            <span className="font-bold text-slate-800">{p2}</span>
                                            <input name="s2" type="tel" defaultValue={matches[editingId].s2} className="w-16 text-center text-xl font-bold border rounded p-1"/>
                                        </div>
                                        <div className="flex gap-2 pt-2">
                                            <button type="button" onClick={() => setEditingId(null)} className="flex-1 py-2 bg-slate-200 font-bold rounded">キャンセル</button>
                                            <button type="submit" className="flex-1 py-2 bg-blue-600 text-white font-bold rounded shadow">保存</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
