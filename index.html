<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【女子の部】那覇地区夏季大会速報</title>
    
    <!-- ライブラリの読み込み（React, Babel, Tailwind CSS, 紙吹雪エフェクト） -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            touch-action: pan-x pan-y;
            -webkit-tap-highlight-color: transparent;
        }
        /* スクロールバーを隠す（スッキリさせるため） */
        ::-webkit-scrollbar { display: none; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .glow-line {
            filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.8));
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 text-slate-900 overscroll-none min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 管理者用パスワード（自由に書き換えてください）
        const ADMIN_PASSWORD = "naha";

        // ==========================================
        // インラインSVGアイコン
        // ==========================================
        const IconTrophy = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const IconZoomIn = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>;
        const IconZoomOut = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>;
        const IconRotateCcw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconX = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconLock = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const IconUnlock = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>;
        const IconEdit = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;

        // ==========================================
        // 大会構造の定義（女子の部 10チーム）
        // ==========================================
        const INITIAL_MATCHES = {
            A3: { id: 'A3', name: 'A3', p1: '昭薬附', p2: '石田', s1: '', s2: '', winner: null, status: '予定' },
            B6: { id: 'B6', name: 'B6', p1: 'コラソン', p2: '浦西', s1: '', s2: '', winner: null, status: '予定' },
            A7: { id: 'A7', name: 'A7', p1: '浦添', p2: 'ITS', s1: '', s2: '', winner: null, status: '予定' },
            B3: { id: 'B3', name: 'B3', p1: '港川', p2: '松島', s1: '', s2: '', winner: null, status: '予定' },
            A6: { id: 'A6', name: 'A6', p1: '神森', p2: null, s1: '', s2: '', winner: null, status: '予定' },
            B7: { id: 'B7', name: 'B7', p1: null, p2: '仲西', s1: '', s2: '', winner: null, status: '予定' },
            あ1: { id: 'あ1', name: '準決勝 (あ1)', p1: null, p2: null, s1: '', s2: '', winner: null, status: '予定' },
            い1: { id: 'い1', name: '準決勝 (い1)', p1: null, p2: null, s1: '', s2: '', winner: null, status: '予定' },
            あ3: { id: 'あ3', name: '決勝 (あ3)', p1: null, p2: null, s1: '', s2: '', winner: null, status: '予定', isFinal: true },
        };

        const CONNECTIONS = [
            { from: 'A3', to: 'A6', toSlot: 'p2' },
            { from: 'B3', to: 'B7', toSlot: 'p1' },
            { from: 'B6', to: 'あ1', toSlot: 'p2' }, 
            { from: 'A6', to: 'あ1', toSlot: 'p1' }, 
            { from: 'A7', to: 'い1', toSlot: 'p1' }, 
            { from: 'B7', to: 'い1', toSlot: 'p2' }, 
            { from: 'あ1', to: 'あ3', toSlot: 'p1' },
            { from: 'い1', to: 'あ3', toSlot: 'p2' },
        ];

        const CARD_W = 210;
        const CARD_H = 86;
        const NODES = {
            seed1: { x: 0, y: 0, label: '神森', isSeed: true, to: 'A6', toSlot: 'p1' },
            A3:    { x: 0, y: 110 },
            B6:    { x: 0, y: 240 },
            A7:    { x: 0, y: 370 },
            B3:    { x: 0, y: 500 },
            seed2: { x: 0, y: 610, label: '仲西', isSeed: true, to: 'B7', toSlot: 'p2' },
            A6:    { x: 280, y: 55 },
            B7:    { x: 280, y: 555 },
            あ1:   { x: 560, y: 148 },
            い1:   { x: 560, y: 463 },
            あ3:   { x: 840, y: 305 }
        };

        // ==========================================
        // 認証（ログイン）モーダル
        // ==========================================
        function AuthModal({ onClose, onLogin }) {
            const [pass, setPass] = useState('');
            const [error, setError] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (pass === ADMIN_PASSWORD) {
                    onLogin();
                } else {
                    setError(true);
                    setPass('');
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200">
                    <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                        <div className="bg-slate-800 p-4 text-white flex justify-between items-center">
                            <h3 className="font-bold flex items-center gap-2"><IconLock className="w-5 h-5"/> 管理者ログイン</h3>
                            <button type="button" onClick={onClose}><IconX className="w-5 h-5 opacity-70 hover:opacity-100"/></button>
                        </div>
                        <div className="p-6">
                            <p className="text-sm text-slate-600 mb-4">試合結果を編集するにはパスワードを入力してください。</p>
                            <input 
                                type="password" 
                                autoFocus
                                value={pass} 
                                onChange={(e) => { setPass(e.target.value); setError(false); }}
                                placeholder="パスワード"
                                className={`w-full border-2 rounded-xl px-4 py-3 text-lg outline-none transition-colors ${error ? 'border-red-400 bg-red-50' : 'border-slate-300 focus:border-blue-500'}`}
                            />
                            {error && <p className="text-red-500 text-sm mt-2 font-bold animate-bounce">パスワードが間違っています</p>}
                        </div>
                        <div className="p-4 bg-slate-50 border-t flex gap-3">
                            <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl font-bold text-slate-600 border border-slate-300 hover:bg-slate-100">キャンセル</button>
                            <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-white bg-slate-800 shadow-md hover:bg-slate-700">ログイン</button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // スコア入力モーダル（機能強化版）
        // ==========================================
        function ScoreModal({ match, onClose, onSave }) {
            const [s1, setS1] = useState(match.s1);
            const [s2, setS2] = useState(match.s2);
            const [status, setStatus] = useState(match.status || '予定');
            const [manualWinner, setManualWinner] = useState(match.winner);

            const calculateWinner = (score1, score2, override) => {
                if (override) return override;
                const num1 = parseInt(score1);
                const num2 = parseInt(score2);
                if (!isNaN(num1) && !isNaN(num2) && status === '終了') {
                    if (num1 > num2) return match.p1;
                    if (num2 > num1) return match.p2;
                }
                return null; 
            };

            const handleSave = () => {
                const finalWinner = calculateWinner(s1, s2, manualWinner);
                onSave(match.id, { ...match, s1, s2, status, winner: finalWinner });
            };

            const isPending = !match.p1 || !match.p2;

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col animate-in slide-in-from-bottom-4 sm:zoom-in-95">
                        
                        <div className="bg-slate-800 px-6 py-5 flex justify-between items-center text-white sm:rounded-t-3xl">
                            <h3 className="font-bold tracking-widest text-lg">{match.name} 編集</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded-full transition-colors"><IconX className="w-6 h-6"/></button>
                        </div>

                        <div className="p-6">
                            {isPending ? (
                                <div className="text-center py-10 text-slate-500 font-bold">
                                    <div className="text-5xl mb-4 opacity-50">⏳</div>
                                    対戦カードが確定していません。<br/>前の試合結果を入力してください。
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    
                                    {/* 進行ステータス */}
                                    <div className="flex justify-center gap-2">
                                        {['予定', '試合中', '終了'].map(st => (
                                            <button 
                                                key={st}
                                                onClick={() => setStatus(st)}
                                                className={`px-5 py-2 rounded-full font-bold text-sm transition-all ${status === st ? 'bg-slate-800 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                            >
                                                {st}
                                            </button>
                                        ))}
                                    </div>

                                    {/* スコア入力 */}
                                    <div className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-inner">
                                        <div className="flex-1 text-xl font-bold text-slate-800 truncate">{match.p1}</div>
                                        <input 
                                            type="tel" 
                                            value={s1} 
                                            onChange={(e) => { setS1(e.target.value); setManualWinner(null); }}
                                            placeholder="0"
                                            className="w-20 text-center text-3xl font-black bg-white border-2 border-slate-300 rounded-xl py-2 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all"
                                        />
                                    </div>

                                    <div className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-inner">
                                        <div className="flex-1 text-xl font-bold text-slate-800 truncate">{match.p2}</div>
                                        <input 
                                            type="tel" 
                                            value={s2} 
                                            onChange={(e) => { setS2(e.target.value); setManualWinner(null); }}
                                            placeholder="0"
                                            className="w-20 text-center text-3xl font-black bg-white border-2 border-slate-300 rounded-xl py-2 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all"
                                        />
                                    </div>

                                    {/* 同点時判定 */}
                                    {(s1 && s2 && s1 === s2 && status === '終了') && (
                                        <div className="pt-4 border-t border-slate-100 animate-in fade-in">
                                            <p className="text-xs font-bold text-amber-600 mb-3 text-center">同点です。最終的な勝者を選択してください</p>
                                            <div className="flex gap-3">
                                                <button onClick={() => setManualWinner(match.p1)} className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all ${manualWinner === match.p1 ? 'bg-red-500 text-white border-red-500 shadow-lg transform scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>{match.p1} の勝ち</button>
                                                <button onClick={() => setManualWinner(match.p2)} className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all ${manualWinner === match.p2 ? 'bg-red-500 text-white border-red-500 shadow-lg transform scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>{match.p2} の勝ち</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-5 bg-slate-50 border-t border-slate-200 flex gap-3 sm:rounded-b-3xl">
                            <button onClick={onClose} className="flex-1 py-3.5 rounded-xl font-bold text-slate-600 bg-white border-2 border-slate-300 hover:bg-slate-100 transition-colors">キャンセル</button>
                            {!isPending && (
                                <button onClick={handleSave} className="flex-[2] py-3.5 rounded-xl font-black text-white bg-blue-600 shadow-lg hover:bg-blue-700 hover:shadow-blue-500/30 transition-all">保存して反映</button>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        // ==========================================
        // メインコンポーネント
        // ==========================================
        function App() {
            const [matches, setMatches] = useState(INITIAL_MATCHES);
            const [editingId, setEditingId] = useState(null);
            const [zoom, setZoom] = useState(1);
            const [showConfirm, setShowConfirm] = useState(false);
            
            // 認証ステート
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            
            const scrollRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0, scrollLeft: 0, scrollTop: 0 });

            // データの読み込み
            useEffect(() => {
                const saved = localStorage.getItem('naha_handball_women_v3');
                if (saved) setMatches(JSON.parse(saved));
            }, []);

            // データの保存
            useEffect(() => {
                localStorage.setItem('naha_handball_women_v3', JSON.stringify(matches));
            }, [matches]);

            // トースト通知（3秒で消える）
            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // 優勝時の紙吹雪
            useEffect(() => {
                if (matches['あ3'].winner && matches['あ3'].status === '終了') {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#f59e0b', '#ef4444', '#3b82f6', '#10b981']
                    });
                }
            }, [matches['あ3'].winner, matches['あ3'].status]);

            const handleCardClick = (matchId) => {
                if (isAdmin) {
                    setEditingId(matchId);
                } else {
                    showToast('編集するには右上の「管理者ログイン」が必要です');
                }
            };

            const handleMouseDown = (e) => {
                if (e.target.closest('.no-drag') || e.target.closest('button')) return;
                setIsDragging(true);
                setDragStart({
                    x: e.clientX || (e.touches && e.touches[0].clientX) || 0,
                    y: e.clientY || (e.touches && e.touches[0].clientY) || 0,
                    scrollLeft: scrollRef.current.scrollLeft, 
                    scrollTop: scrollRef.current.scrollTop
                });
            };
            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
                const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
                const walkX = (currentX - dragStart.x) * 1.5;
                const walkY = (currentY - dragStart.y) * 1.5;
                scrollRef.current.scrollLeft = dragStart.scrollLeft - walkX;
                scrollRef.current.scrollTop = dragStart.scrollTop - walkY;
            };
            const handleMouseUp = () => setIsDragging(false);

            const clearDownstream = (matchesObj, currentId) => {
                const conn = CONNECTIONS.find(c => c.from === currentId);
                if (!conn) return;
                const nextId = conn.to;
                matchesObj[nextId][conn.toSlot] = null;
                matchesObj[nextId].winner = null;
                matchesObj[nextId].s1 = '';
                matchesObj[nextId].s2 = '';
                matchesObj[nextId].status = '予定';
                clearDownstream(matchesObj, nextId);
            };

            const handleSaveMatch = (id, data) => {
                const newMatches = { ...matches, [id]: data };
                const conn = CONNECTIONS.find(c => c.from === id);

                if (data.winner) {
                    if (conn) newMatches[conn.to] = { ...newMatches[conn.to], [conn.toSlot]: data.winner };
                } else {
                    if (conn) {
                        newMatches[conn.to] = { ...newMatches[conn.to], [conn.toSlot]: null };
                        clearDownstream(newMatches, conn.to);
                    }
                }
                setMatches(newMatches);
                setEditingId(null);
            };

            const executeReset = () => {
                setMatches(INITIAL_MATCHES);
                setShowConfirm(false);
                showToast('データをリセットしました');
            };

            const renderPaths = () => {
                const paths = [];
                ['seed1', 'seed2'].forEach(seedId => {
                    const node = NODES[seedId];
                    const toNode = NODES[node.to];
                    const startX = node.x + 120;
                    const startY = node.y + 20;
                    const endX = toNode.x;
                    const endY = node.toSlot === 'p1' ? toNode.y + 20 : toNode.y + 66;
                    const midX = startX + (endX - startX) / 2;
                    paths.push(
                        <path key={`${seedId}-line`} d={`M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`} fill="none" stroke="#ef4444" strokeWidth="4" className="glow-line" strokeLinecap="round" strokeLinejoin="round" />
                    );
                });

                CONNECTIONS.forEach(({ from, to, toSlot }) => {
                    const fromNode = NODES[from];
                    const toNode = NODES[to];
                    const startX = fromNode.x + CARD_W;
                    const startY = fromNode.y + 43;
                    const endX = toNode.x;
                    const endY = toSlot === 'p1' ? toNode.y + 20 : toNode.y + 66;
                    const midX = startX + (endX - startX) / 2;

                    const isActive = matches[from].winner !== null;
                    const color = isActive ? "#ef4444" : "#cbd5e1";
                    const width = isActive ? "4" : "3";
                    const glowClass = isActive ? "glow-line" : "";

                    paths.push(
                        <path key={`${from}-${to}`} d={`M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`} fill="none" stroke={color} strokeWidth={width} className={`transition-all duration-500 ${glowClass}`} strokeLinecap="round" strokeLinejoin="round" />
                    );
                });
                return paths;
            };

            const champion = matches['あ3'].winner;

            return (
                <div className="absolute inset-0 flex flex-col overflow-hidden">
                    
                    {/* ヘッダー（リッチ化） */}
                    <header className="bg-slate-900 text-white shadow-lg z-20 shrink-0 relative">
                        <div className="absolute inset-0 bg-gradient-to-r from-blue-900/50 to-transparent pointer-events-none"></div>
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center relative z-10">
                            <div className="flex flex-col">
                                <h1 className="text-base md:text-xl font-black tracking-wider flex items-center gap-2">
                                    <IconTrophy className="w-5 h-5 md:w-6 md:h-6 text-amber-400 drop-shadow-[0_0_8px_rgba(251,191,36,0.5)]" />
                                    那覇地区夏季大会速報
                                </h1>
                                <p className="text-[10px] md:text-xs text-blue-200 mt-0.5 font-bold tracking-widest">女子の部 / ANA ARENA</p>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                {/* 管理者モード切替ボタン */}
                                {isAdmin ? (
                                    <button onClick={() => { setIsAdmin(false); showToast('閲覧モードに戻りました'); }} className="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-[0_0_10px_rgba(16,185,129,0.4)]">
                                        <IconUnlock className="w-3.5 h-3.5" /> 編集モード
                                    </button>
                                ) : (
                                    <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-full text-xs font-bold transition-all border border-slate-600">
                                        <IconLock className="w-3.5 h-3.5" /> 閲覧中
                                    </button>
                                )}

                                <div className="hidden md:flex gap-1 border-l border-slate-700 pl-3">
                                    <button onClick={() => setZoom(z => Math.max(0.5, z - 0.1))} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors"><IconZoomOut className="w-4 h-4" /></button>
                                    <button onClick={() => setZoom(z => Math.min(1.5, z + 0.1))} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors"><IconZoomIn className="w-4 h-4" /></button>
                                    {isAdmin && <button onClick={() => setShowConfirm(true)} className="p-2 bg-slate-800 hover:bg-red-900/50 text-red-400 rounded-lg transition-colors ml-1"><IconRotateCcw className="w-4 h-4" /></button>}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* トースト通知 */}
                    {toastMsg && (
                        <div className="absolute top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white px-4 py-2 rounded-full shadow-xl text-sm font-bold flex items-center gap-2 animate-in slide-in-from-top-4 fade-in duration-300">
                            <IconInfo className="w-4 h-4 text-blue-400" /> {toastMsg}
                        </div>
                    )}

                    <main 
                        ref={scrollRef}
                        className="flex-1 overflow-auto cursor-grab active:cursor-grabbing relative hide-scrollbar"
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                        onTouchStart={handleMouseDown}
                        onTouchMove={handleMouseMove}
                        onTouchEnd={handleMouseUp}
                    >
                        <div 
                            className="absolute origin-top-left transition-transform duration-200 ease-out p-12 md:p-16"
                            style={{ width: '1300px', height: '900px', transform: `scale(${zoom})` }}
                        >
                            <svg className="absolute inset-0 pointer-events-none" width="100%" height="100%">
                                {renderPaths()}
                            </svg>

                            {/* シード枠 */}
                            {['seed1', 'seed2'].map(id => (
                                <div key={id} className="absolute flex items-center justify-center bg-red-500 rounded-lg font-black text-white shadow-lg border-2 border-red-600" style={{ left: NODES[id].x, top: NODES[id].y, width: 120, height: 40, letterSpacing: '2px' }}>
                                    {NODES[id].label}
                                </div>
                            ))}

                            {/* 試合カード */}
                            {Object.values(matches).map(match => {
                                const node = NODES[match.id];
                                const isWinnerDefined = match.winner !== null;
                                const isFinished = match.status === '終了';

                                // ステータスに応じた色
                                const statusColors = {
                                    '予定': 'bg-slate-200 text-slate-500',
                                    '試合中': 'bg-blue-500 text-white animate-pulse',
                                    '終了': 'bg-slate-700 text-white'
                                };

                                return (
                                    <div 
                                        key={match.id} 
                                        onClick={() => handleCardClick(match.id)}
                                        className={`no-drag absolute glass-card border-2 rounded-2xl shadow-sm transition-all duration-300 flex flex-col overflow-hidden group ${isAdmin ? 'cursor-pointer hover:shadow-xl hover:-translate-y-1' : 'cursor-default'} ${isWinnerDefined ? 'border-red-400 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-slate-300'}`}
                                        style={{ left: node.x, top: node.y, width: CARD_W, height: CARD_H }}
                                    >
                                        <div className="absolute top-0 left-0 bg-slate-800 text-white text-[9px] font-black px-2.5 py-0.5 rounded-br-lg z-10 tracking-widest">
                                            {match.name}
                                        </div>
                                        <div className={`absolute top-0 right-0 text-[9px] font-bold px-2 py-0.5 rounded-bl-lg z-10 tracking-widest ${statusColors[match.status]}`}>
                                            {match.status}
                                        </div>
                                        
                                        <div className={`flex-1 flex items-center px-4 border-b border-slate-200/50 mt-4 ${match.winner === match.p1 ? 'bg-red-50' : ''}`}>
                                            <span className={`flex-1 truncate text-sm pl-4 ${match.winner === match.p1 ? 'font-black text-red-600' : 'text-slate-800 font-bold'}`}>
                                                {match.p1 || <span className="text-slate-300 font-normal">未定</span>}
                                            </span>
                                            <span className={`w-8 text-right font-black text-xl ${match.winner === match.p1 ? 'text-red-600' : 'text-slate-800'}`}>
                                                {match.s1}
                                            </span>
                                        </div>
                                        
                                        <div className={`flex-1 flex items-center px-4 ${match.winner === match.p2 ? 'bg-red-50' : ''}`}>
                                            <span className={`flex-1 truncate text-sm pl-4 ${match.winner === match.p2 ? 'font-black text-red-600' : 'text-slate-800 font-bold'}`}>
                                                {match.p2 || <span className="text-slate-300 font-normal">未定</span>}
                                            </span>
                                            <span className={`w-8 text-right font-black text-xl ${match.winner === match.p2 ? 'text-red-600' : 'text-slate-800'}`}>
                                                {match.s2}
                                            </span>
                                        </div>

                                        {/* 管理者モード時のみ表示される編集アイコン */}
                                        {isAdmin && (
                                            <div className="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[1px]">
                                                <div className="bg-blue-600 text-white p-2 rounded-full shadow-lg"><IconEdit className="w-5 h-5" /></div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}

                            {/* 優勝表示 */}
                            {champion && (
                                <div className="absolute bg-gradient-to-b from-amber-200 to-amber-100 border-4 border-amber-400 rounded-3xl shadow-[0_0_30px_rgba(251,191,36,0.5)] flex items-center justify-center p-6 gap-4 animate-bounce" style={{ left: NODES['あ3'].x + 250, top: NODES['あ3'].y }}>
                                    <IconTrophy className="w-10 h-10 text-amber-600 drop-shadow-md" />
                                    <div>
                                        <div className="text-sm text-amber-700 font-black tracking-widest mb-1">CHAMPION</div>
                                        <div className="text-3xl font-black text-slate-900 tracking-wider">{champion}</div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* モーダル群 */}
                    {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} onLogin={() => { setIsAdmin(true); setShowAuthModal(false); showToast('編集モードに切り替わりました'); }} />}
                    
                    {editingId && <ScoreModal match={matches[editingId]} onClose={() => setEditingId(null)} onSave={handleSaveMatch} />}

                    {showConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full animate-in zoom-in-95">
                                <h3 className="text-xl font-black text-red-600 mb-2 flex items-center gap-2"><IconRotateCcw className="w-6 h-6"/> リセット確認</h3>
                                <p className="text-sm text-slate-600 font-bold mb-6">入力したすべての試合結果が消去されます。本当によろしいですか？</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">キャンセル</button>
                                    <button onClick={executeReset} className="flex-1 py-3 rounded-xl font-bold text-white bg-red-600 shadow-md hover:bg-red-700">リセットする</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 汎用インフォアイコン
        const IconInfo = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
