<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【女子の部】那覇地区夏季大会速報</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        /* スコア入力時にスマホがズームするのを防ぐ */
        input[type="tel"] {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ADMIN_PASSWORD = "naha";

        // ==========================================
        // 描画キャンバスの論理サイズ（アスペクト比計算用）
        // ==========================================
        const CANVAS_W = 400;
        const CANVAS_H = 310;
        const CARD_W = 62;
        const CARD_H = 44;

        // ノードの論理座標 (cx: 中心X, y: 上端Y)
        const NODES = {
            seed1: { cx: 35,  y: 250, label: '神森', isSeed: true },
            A3:    { cx: 101, y: 250, label: 'A3' },
            B6:    { cx: 167, y: 250, label: 'B6' },
            A7:    { cx: 233, y: 250, label: 'A7' },
            B3:    { cx: 299, y: 250, label: 'B3' },
            seed2: { cx: 365, y: 250, label: '仲西', isSeed: true },
            
            A6:    { cx: 68,  y: 170, label: 'A6' },
            B7:    { cx: 332, y: 170, label: 'B7' },
            
            あ1:   { cx: 117.5, y: 90, label: 'あ1' },
            い1:   { cx: 282.5, y: 90, label: 'い1' },
            
            あ3:   { cx: 200,   y: 10, label: 'あ3(決勝)' }
        };

        const CONNECTIONS = [
            { from: 'seed1', to: 'A6' },
            { from: 'A3',    to: 'A6' },
            { from: 'A6',    to: 'あ1' },
            { from: 'B6',    to: 'あ1' },
            { from: 'あ1',   to: 'あ3' },
            { from: 'A7',    to: 'い1' },
            { from: 'B3',    to: 'B7' },
            { from: 'seed2', to: 'B7' },
            { from: 'B7',    to: 'い1' },
            { from: 'い1',   to: 'あ3' }
        ];

        function App() {
            const [matches, setMatches] = useState({
                A3: { s1: '', s2: '', winner: null },
                B6: { s1: '', s2: '', winner: null },
                A7: { s1: '', s2: '', winner: null },
                B3: { s1: '', s2: '', winner: null },
                A6: { s1: '', s2: '', winner: null },
                B7: { s1: '', s2: '', winner: null },
                あ1: { s1: '', s2: '', winner: null },
                い1: { s1: '', s2: '', winner: null },
                あ3: { s1: '', s2: '', winner: null }
            });
            const [isAdmin, setIsAdmin] = useState(false);
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('naha_hb_v5');
                if (saved) setMatches(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('naha_hb_v5', JSON.stringify(matches));
            }, [matches]);

            // 勝ち上がりチーム名の取得
            const getTeam = (id, isP1) => {
                const w = (matchId) => matches[matchId]?.winner || null;
                if (id === 'A3') return isP1 ? '昭薬附' : '石田';
                if (id === 'B6') return isP1 ? 'コラソン' : '浦西';
                if (id === 'A7') return isP1 ? '浦添' : 'ITS';
                if (id === 'B3') return isP1 ? '港川' : '松島';
                
                if (id === 'A6') return isP1 ? '神森' : w('A3');
                if (id === 'B7') return isP1 ? w('B3') : '仲西';
                
                if (id === 'あ1') return isP1 ? w('A6') : w('B6');
                if (id === 'い1') return isP1 ? w('A7') : w('B7');
                
                if (id === 'あ3') return isP1 ? w('あ1') : w('い1');
                return null;
            };

            const handleAuth = () => {
                if (isAdmin) {
                    setIsAdmin(false);
                } else {
                    const pass = prompt("パスワードを入力してください");
                    if (pass === ADMIN_PASSWORD) setIsAdmin(true);
                    else if (pass !== null) alert("パスワードが違います");
                }
            };

            const handleCardClick = (id) => {
                if (!isAdmin) return;
                setEditingId(id);
            };

            const handleSave = (id, s1, s2) => {
                const p1 = getTeam(id, true);
                const p2 = getTeam(id, false);
                let winner = null;

                const n1 = parseInt(s1);
                const n2 = parseInt(s2);
                if (!isNaN(n1) && !isNaN(n2)) {
                    if (n1 > n2) winner = p1;
                    else if (n2 > n1) winner = p2;
                    else {
                        winner = window.confirm(`${p1} を勝者にしますか？\n(キャンセルで ${p2} の勝ち)`) ? p1 : p2;
                    }
                }

                const newMatches = { ...matches, [id]: { s1, s2, winner } };
                
                // 勝者がリセットされた場合、その先の試合結果もクリアする
                if (!winner) {
                    const resetDownstream = (currentId) => {
                        const conn = CONNECTIONS.find(c => c.from === currentId);
                        if (conn) {
                            newMatches[conn.to] = { s1: '', s2: '', winner: null };
                            resetDownstream(conn.to);
                        }
                    };
                    resetDownstream(id);
                }
                
                setMatches(newMatches);
                setEditingId(null);
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* ヘッダー */}
                    <header className="bg-slate-800 text-white px-4 py-3 flex justify-between items-center shadow sticky top-0 z-10">
                        <h1 className="text-sm font-bold tracking-wider">那覇地区夏季大会 (女子)</h1>
                        <button 
                            onClick={handleAuth}
                            className={`px-3 py-1.5 text-xs font-bold rounded-full ${isAdmin ? 'bg-emerald-500 text-white' : 'bg-slate-600 text-slate-200'}`}
                        >
                            {isAdmin ? '🔓 編集モード' : '🔒 閲覧モード'}
                        </button>
                    </header>

                    {/* トーナメント描画エリア */}
                    <main className="flex-1 w-full flex flex-col items-center pt-4 pb-8 px-2">
                        
                        {/* レスポンシブコンテナ（画面幅に合わせて自動縮尺） */}
                        <div 
                            className="w-full max-w-[500px] relative bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden" 
                            style={{ aspectRatio: `${CANVAS_W} / ${CANVAS_H}` }}
                        >
                            {/* 線の描画 (SVG) */}
                            <svg viewBox={`0 0 ${CANVAS_W} ${CANVAS_H}`} className="absolute inset-0 w-full h-full">
                                {CONNECTIONS.map((c, i) => {
                                    const fromNode = NODES[c.from];
                                    const toNode = NODES[c.to];
                                    
                                    const startX = fromNode.cx;
                                    const startY = fromNode.y;
                                    const endX = toNode.cx;
                                    const endY = toNode.y + CARD_H; // 親ノードの下端
                                    
                                    const midY = startY + (endY - startY) / 2;

                                    // 勝者の線は赤くする
                                    const isWinnerPath = c.from.startsWith('seed') || (matches[c.from] && matches[c.from].winner);
                                    const color = isWinnerPath ? "#ef4444" : "#cbd5e1";
                                    const strokeW = isWinnerPath ? "2.5" : "1.5";

                                    return (
                                        <path 
                                            key={i} 
                                            d={`M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`} 
                                            fill="none" stroke={color} strokeWidth={strokeW} 
                                        />
                                    );
                                })}
                            </svg>

                            {/* カードの描画 (HTML絶対配置) */}
                            {Object.entries(NODES).map(([id, node]) => {
                                // 座標をパーセント(%)に変換して配置することで絶対崩れない
                                const left = `${((node.cx - CARD_W / 2) / CANVAS_W) * 100}%`;
                                const top = `${(node.y / CANVAS_H) * 100}%`;
                                const width = `${(CARD_W / CANVAS_W) * 100}%`;
                                const height = `${(CARD_H / CANVAS_H) * 100}%`;

                                if (node.isSeed) {
                                    return (
                                        <div key={id} className="absolute flex items-center justify-center font-bold text-red-600 tracking-widest" style={{ left, top, width, height, fontSize: '11px' }}>
                                            {node.label}
                                        </div>
                                    );
                                }

                                const match = matches[id];
                                const p1 = getTeam(id, true);
                                const p2 = getTeam(id, false);
                                const w = match.winner;

                                return (
                                    <div 
                                        key={id} 
                                        onClick={() => handleCardClick(id)}
                                        className={`absolute bg-white border border-slate-300 rounded flex flex-col overflow-hidden shadow-sm ${isAdmin ? 'cursor-pointer active:bg-slate-50' : ''}`}
                                        style={{ left, top, width, height }}
                                    >
                                        <div className="bg-slate-100 text-center font-bold text-slate-500 border-b border-slate-200" style={{ fontSize: '8px', padding: '1px 0' }}>
                                            {node.label}
                                        </div>
                                        <div className={`flex-1 flex px-1 items-center justify-between ${w && w === p1 ? 'bg-red-50' : ''}`}>
                                            <span className={`truncate ${w && w === p1 ? 'font-bold text-red-600' : 'text-slate-700'}`} style={{ width: '65%', fontSize: '10px' }}>{p1 || '-'}</span>
                                            <span className={`font-bold ${w && w === p1 ? 'text-red-600' : 'text-slate-900'}`} style={{ fontSize: '11px' }}>{match.s1}</span>
                                        </div>
                                        <div className={`flex-1 flex px-1 items-center justify-between border-t border-slate-100 ${w && w === p2 ? 'bg-red-50' : ''}`}>
                                            <span className={`truncate ${w && w === p2 ? 'font-bold text-red-600' : 'text-slate-700'}`} style={{ width: '65%', fontSize: '10px' }}>{p2 || '-'}</span>
                                            <span className={`font-bold ${w && w === p2 ? 'text-red-600' : 'text-slate-900'}`} style={{ fontSize: '11px' }}>{match.s2}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <p className="text-center text-slate-400 text-xs mt-6 font-bold">
                            {isAdmin ? 'カードをタップしてスコアを入力' : '大会本部の速報システム'}
                        </p>
                    </main>

                    {/* スコア入力モーダル */}
                    {editingId && (() => {
                        const p1 = getTeam(editingId, true);
                        const p2 = getTeam(editingId, false);
                        
                        if (!p1 || !p2) {
                            return (
                                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50">
                                    <div className="bg-white p-6 rounded-xl text-center shadow-2xl w-full max-w-xs">
                                        <p className="font-bold mb-4 text-slate-700">対戦カードが未確定です<br/>前の試合結果を入力してください</p>
                                        <button onClick={() => setEditingId(null)} className="w-full py-3 bg-slate-200 text-slate-700 rounded-lg font-bold">閉じる</button>
                                    </div>
                                </div>
                            );
                        }
                        
                        return (
                            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                                <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden">
                                    <div className="bg-slate-800 text-white px-5 py-4 font-bold text-center tracking-widest">
                                        {NODES[editingId].label} 試合結果
                                    </div>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        handleSave(editingId, e.target.s1.value, e.target.s2.value);
                                    }} className="p-6">
                                        
                                        <div className="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
                                            <span className="font-bold text-slate-800 text-lg w-1/2 truncate">{p1}</span>
                                            <input name="s1" type="tel" defaultValue={matches[editingId].s1} className="w-20 text-center text-2xl font-black border-2 border-slate-300 rounded-lg p-2 focus:border-blue-500 outline-none" autoFocus/>
                                        </div>
                                        
                                        <div className="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                                            <span className="font-bold text-slate-800 text-lg w-1/2 truncate">{p2}</span>
                                            <input name="s2" type="tel" defaultValue={matches[editingId].s2} className="w-20 text-center text-2xl font-black border-2 border-slate-300 rounded-lg p-2 focus:border-blue-500 outline-none"/>
                                        </div>

                                        <div className="flex gap-3">
                                            <button type="button" onClick={() => setEditingId(null)} className="flex-1 py-3.5 bg-white text-slate-600 font-bold rounded-xl border border-slate-300">キャンセル</button>
                                            <button type="submit" className="flex-[2] py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow-md">保存する</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
